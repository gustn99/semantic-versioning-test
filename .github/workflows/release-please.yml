name: release-please experiment

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      notes_style:
        description: Changelog format for this run
        type: choice
        required: true
        default: custom
        options: [default, github, custom]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release helpers
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Normalize Rilog feature title for release-please
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/sync-release-please-commit-override.cjs

      - name: Select notes format
        id: mode
        env:
          REQUESTED_STYLE: ${{ inputs.notes_style }}
        run: |
          style="${REQUESTED_STYLE:-custom}"
          case "$style" in
            default|github) config="release-please.${style}.json" ;;
            custom) config="release-please.github.json" ;;
            *) echo "Unsupported notes style: $style" >&2; exit 1 ;;
          esac
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "style=$style" >> "$GITHUB_OUTPUT"

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: ${{ steps.mode.outputs.config }}
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Customize GitHub Release notes
        if: steps.release.outputs.release_created == 'true' && steps.mode.outputs.style == 'custom'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: node scripts/update-release-notes.cjs

      - name: Record run
        env:
          STYLE: ${{ steps.mode.outputs.style }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
        run: |
          {
            echo "## Release Please experiment"
            echo "- Notes style: \`$STYLE\`"
            echo "- Release PR created or updated: \`$PRS_CREATED\`"
            echo "- Release created: \`$RELEASE_CREATED\`"
            if [ -n "$TAG_NAME" ]; then echo "- Tag: \`$TAG_NAME\`"; fi
            if [ -n "$RELEASE_URL" ]; then echo "- Release: $RELEASE_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
